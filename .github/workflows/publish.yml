name: Publish to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match pyproject.toml)
        required: true
        type: string
        default: '0.2.2'

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate release settings
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path('pyproject.toml').read_text())
          if metadata['project']['version'] != os.environ['RELEASE_VERSION']:
              raise SystemExit('Version must match pyproject.toml.')
          if metadata['tool']['comfy']['PublisherId'] != 'nightwarrior':
              raise SystemExit('Publisher ID must be nightwarrior.')
          if not os.environ.get('REGISTRY_ACCESS_TOKEN'):
              raise SystemExit('Add the REGISTRY_ACCESS_TOKEN repository secret.')
          print('Release settings validated.')
          PY

      - name: Install publishing CLI
        run: python -m pip install --disable-pip-version-check 'comfy-cli==1.23.0'

      - name: Publish version
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
